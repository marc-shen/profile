schema = 1
priority = ["cernet"]

[proxy]
# CERNET may select different member mirrors for different files. Cover mirror
# hosts at universities/research institutes without bypassing whole institutions.
direct_regex = ['^(?:[a-z0-9-]+\.)*mirrors?\.[a-z0-9.-]+\.(?:edu|ac)\.cn$']
direct_domains = [
  "tuna.tsinghua.edu.cn", "mirrors.ustc.edu.cn",
  "mirror.sjtu.edu.cn", "mirrors.sjtug.sjtu.edu.cn", "s3.jcloud.sjtu.edu.cn",
  "mirrors.bfsu.edu.cn", "mirror.nju.edu.cn", "mirrors.nju.edu.cn",
  "mirrors.aliyun.com", "mirrors.cloud.tencent.com", "mirrors.huaweicloud.com",
  "repo.huaweicloud.com", "mirrors.cernet.edu.cn", "mirrorz.org",
  "mirrors.cqulug.club", "mirrors-metadata.cqulug.club", "mirrors.byrio.org",
]

[sites.cernet]
# Labels are ordered from lower to higher preference; CERNET handles fallback.
name = "CERNET 联合镜像（清华 → 科大 → 交大偏好）"
base = "https://sjtug-ustc-tuna.mirrors.cernet.edu.cn"
fedora = "https://sjtug-ustc-tuna.mirrors.cernet.edu.cn/fedora"
flatpak = "https://sjtug-ustc-tuna.mirrors.cernet.edu.cn/flathub"
