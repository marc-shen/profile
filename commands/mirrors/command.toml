schema = 1
name = "mirrors"
kind = "command"
description = "软件镜像源：CERNET 教育网联合镜像"
platforms = ["steamdeck", "fedora", "ubuntu"]
requires = []
entrypoint = ["{python}", "{repo}/libexec/component.py", "mirrors"]
arguments = "[auto|dnf|flatpak|apt]"
targets = ["auto", "dnf", "flatpak", "apt"]

[actions.list]
description = "查看联合镜像入口和当前配置"
platforms = ["macos", "steamdeck", "fedora", "ubuntu", "debian"]
[actions.check]
description = "检查当前源及仓库元数据可达性"
[actions.install]
description = "验证并应用 CERNET 联合镜像"
[actions.apply]
description = "验证并应用 CERNET 联合镜像"
[actions.update]
description = "检测 CERNET 联合镜像并刷新元数据"
[actions.restore]
description = "恢复首次换源前的配置"
