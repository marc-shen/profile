schema = 1
name = "mirrors"
kind = "command"
description = "软件镜像源：清华 → 科大 → 交大"
platforms = ["steamdeck", "fedora", "ubuntu"]
requires = []
entrypoint = ["{python}", "{repo}/libexec/component.py", "mirrors"]
arguments = "[auto|dnf|flatpak|apt]"
targets = ["auto", "dnf", "flatpak", "apt"]

[actions.list]
description = "列出镜像优先级和当前配置"
platforms = ["macos", "steamdeck", "fedora", "ubuntu", "debian"]
[actions.check]
description = "检查当前源及仓库元数据可达性"
[actions.install]
description = "按优先级选择并应用可用镜像"
[actions.apply]
description = "按优先级选择并应用可用镜像"
[actions.update]
description = "重新检测镜像优先级并刷新元数据"
[actions.restore]
description = "恢复首次换源前的配置"
