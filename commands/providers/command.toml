schema = 1
name = "providers"
kind = "command"
description = "安装后端管理"
platforms = ["macos", "steamdeck", "fedora", "ubuntu", "debian"]
requires = []
entrypoint = ["{python}", "{repo}/libexec/component.py", "providers"]
targets = ["uv", "pixi"]

[actions]

[actions.list]
description = "查看软件与安装状态"

[actions.check]
description = "检查安装状态"

[actions.install]
description = "补齐缺失安装"

[actions.update]
description = "更新此软件"
