schema = 1
name = "bash-language-server"
description = "bash-language-server 语言工具"
category = "development"
tags = ["language-server"]
platforms = ["macos", "steamdeck", "fedora", "ubuntu", "debian"]
requires = []
entrypoint = ["{python}", "{repo}/libexec/component.py", "bash-language-server"]
arguments = ""

[actions]

[actions.list]
platforms = ["macos", "steamdeck", "fedora", "ubuntu", "debian"]
description = "查看软件与安装状态"

[actions.check]
description = "检查安装状态"

[actions.check.options]
--probe = "验证 LSP initialize/shutdown 协议"

[actions.install]
description = "补齐缺失安装"

[actions.install.options]
--probe = "验证已有语言服务器的 LSP 协议"

[actions.update]
description = "更新此软件"

[install]
package = "bash-language-server"
commands = ["bash-language-server"]
lsp = ["bash-language-server", "start"]
provider = "pixi"
kind = "language-server"
storage_name = "bash"
