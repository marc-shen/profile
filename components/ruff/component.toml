schema = 1
name = "ruff"
description = "ruff 语言工具"
category = "development"
tags = ["language-server"]
platforms = ["macos", "steamdeck", "fedora", "ubuntu", "debian"]
requires = []
entrypoint = ["{python}", "{repo}/libexec/component.py", "ruff"]
arguments = ""

[actions]

[actions.list]
platforms = ["macos", "steamdeck", "fedora", "ubuntu", "debian"]
description = "查看软件与安装状态"

[actions.check]
description = "检查安装状态"

[actions.check.options]
--probe = "验证 LSP initialize/shutdown 协议"

[actions.install]
description = "补齐缺失安装"

[actions.install.options]
--probe = "验证已有语言服务器的 LSP 协议"

[actions.update]
description = "更新此软件"

[install]
package = "ruff"
commands = ["ruff"]
lsp = ["ruff", "server"]
version = ["ruff", "--version"]
provider = "uv"
kind = "language-server"
storage_name = "ruff"
